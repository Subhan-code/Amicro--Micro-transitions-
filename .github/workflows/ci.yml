name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint / Type Check
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Verify Registry Output
        run: |
          node -e "
            const fs = require('fs');
            const fadeUp = JSON.parse(fs.readFileSync('public/r/fade-up.json', 'utf8'));
            if (!fadeUp.name || fadeUp.name !== 'fade-up') throw new Error('Invalid fade-up.json');
            const items = fs.readdirSync('public/r').filter(f => f.endsWith('.json') && f !== 'index.json' && f !== 'registry.json');
            if (items.length < 160) throw new Error('Expected at least 160 registry items, found ' + items.length);
            console.log('✓ CI Registry check passed: ' + items.length + ' items generated.');
          "

